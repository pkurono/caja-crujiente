<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E5B37">
<meta name="description" content="Ventas, inventario, fiado y reportes para papitas, maní y tostones.">

<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<title>Caja Crujiente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: app de una pantalla para el teléfono — barra superior con tasa, contenido desplazable, pestañas abajo */
:root{
  --bg:#F6F7EF; --surface:#FFFFFF; --ink:#1D2418; --muted:#66705C; --line:#DCE0D0;
  --leaf:#1E5B37; --leaf-ink:#FFFFFF; --gold:#F2B705; --gold-soft:#FCEFC2;
  --ok:#2E7D4F; --warn:#B26A00; --bad:#B3261E; --bad-soft:#FBE3E1;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Nunito Sans",ui-sans-serif,system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme]){
  --bg:#12160F; --surface:#1B2117; --ink:#EEF1E6; --muted:#9BA58E; --line:#2E3727;
  --leaf:#5FBF85; --leaf-ink:#0E1A12; --gold:#F5C431; --gold-soft:#3A3315;
  --ok:#6FCF94; --warn:#F0A64A; --bad:#F2867D; --bad-soft:#3A1C1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12160F; --surface:#1B2117; --ink:#EEF1E6; --muted:#9BA58E; --line:#2E3727;
  --leaf:#5FBF85; --leaf-ink:#0E1A12; --gold:#F5C431; --gold-soft:#3A3315;
  --ok:#6FCF94; --warn:#F0A64A; --bad:#F2867D; --bad-soft:#3A1C1A; color-scheme:dark}
/* Modo sol: máximo contraste y letra más grande para vender a pleno sol */
:root[data-theme="sol"]{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#000000; --muted:#2E3328; --line:#7D856F;
  --leaf:#0B4A26; --leaf-ink:#FFFFFF; --gold:#FFC400; --gold-soft:#FFF0B3;
  --ok:#0B6B34; --warn:#7A4200; --bad:#A3150D; --bad-soft:#FFE1DE; color-scheme:light; font-size:18px}
:root[data-theme="sol"] body{font-size:17px;font-weight:600}
:root[data-theme="sol"] .prod,:root[data-theme="sol"] .list,:root[data-theme="sol"] .money,:root[data-theme="sol"] .kpi,:root[data-theme="sol"] .ctable,:root[data-theme="sol"] .chip,:root[data-theme="sol"] .mini,:root[data-theme="sol"] .bars{border-width:2px;border-color:var(--line)}
:root[data-theme="sol"] .muted,:root[data-theme="sol"] .sub,:root[data-theme="sol"] .prod .s{color:var(--muted);font-weight:700}
.gear{width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:var(--leaf-ink);display:grid;place-items:center;cursor:pointer}
.themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.themes label{display:flex;flex-direction:column;gap:2px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:800}
.themes label small{font-weight:600;color:var(--muted);font-size:.78rem}
.themes input{position:absolute;opacity:0;pointer-events:none}
.themes label:has(input:checked){border-color:var(--leaf);background:var(--gold-soft)}
.themes label:focus-within{outline:3px solid var(--gold);outline-offset:2px}
.fiadobtns{flex-wrap:wrap;justify-content:flex-end}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;display:flex;flex-direction:column}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:720px;margin:0 auto;width:100%;box-sizing:border-box}
header{background:var(--leaf);color:var(--leaf-ink);z-index:5}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em;margin:0}
.brand{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{overflow:hidden;text-overflow:ellipsis}
.hbtns{flex:none}
.brand small{display:block;font-family:var(--f-body);font-weight:600;font-size:.72rem;opacity:.8;letter-spacing:.06em;text-transform:uppercase}
.tasa{background:var(--gold);color:#241C00;border:0;border-radius:999px;padding:8px 14px;font:600 .85rem var(--f-num);cursor:pointer;white-space:nowrap}
.tasa.off{background:var(--bad);color:#fff}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
main .wrap{padding-block:16px 24px;display:flex;flex-direction:column;gap:16px}
nav.tabs{background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav.tabs button{background:none;border:0;color:var(--muted);font:600 .78rem var(--f-body);padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="true"]{color:var(--leaf)}
nav.tabs button[aria-current="true"] .dot{background:var(--gold)}
.dot{width:28px;height:4px;border-radius:2px;background:transparent}
h2{font-family:var(--f-display);font-weight:800;font-size:1.35rem;margin:0;text-wrap:balance;letter-spacing:-.01em}
h3{font-family:var(--f-display);font-weight:600;font-size:1rem;margin:0}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--muted)}
.banner{background:var(--gold-soft);border-radius:12px;padding:12px 14px;font-size:.9rem}
.banner.bad{background:var(--bad-soft)}
/* productos para vender */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pcard{position:relative}
.prod{position:relative;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px;text-align:left;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-height:150px;box-sizing:border-box}
.prod.on{border-color:var(--leaf)}
.prod:active{transform:scale(.98)}
.prod .ill{width:54px;height:54px;border-radius:16px;display:grid;place-items:center}
.prod .ill svg{width:34px;height:34px}
.prod .n{font-weight:800;font-size:1.05rem;line-height:1.15}
.prod .p{font-family:var(--f-num);font-weight:600;font-size:1.35rem}
.prod .s{font-size:.75rem;color:var(--muted)}
.prod .s.low{color:var(--warn);font-weight:800}
.prod .s.zero{color:var(--bad);font-weight:800}
.prod .q{position:absolute;top:10px;right:10px;background:var(--leaf);color:var(--leaf-ink);border-radius:999px;min-width:32px;height:32px;display:grid;place-items:center;font:600 1rem var(--f-num);padding:0 8px;box-sizing:border-box}
.minus{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.3rem;cursor:pointer;display:grid;place-items:center}
/* barra de cobro fija */
#dock{background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(0,0,0,.08)}
#dock .wrap{padding-block:10px;display:flex;flex-direction:column;gap:10px}
.paychips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px}
.paychips .chip{flex:none;padding:8px 11px;font-size:.8rem;min-height:36px}
.paybar{display:flex;align-items:center;gap:10px}
.paybar .sum{flex:1;min-width:0;display:flex;flex-direction:column}
.paybar .sum .u{font:600 1.5rem var(--f-num);line-height:1.1}
.paybar .icon{width:48px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.paybar .go{height:52px;padding:0 22px;border-radius:14px;font-size:1.05rem}
.dockcli{display:flex;gap:8px;align-items:center}
.dockcli select{flex:1;min-width:0;font:600 .95rem var(--f-body);padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
/* inicio */
.money{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.money .bar .fill.bad{background:var(--bad)}
.cta-dark{background:var(--ink);color:var(--bg);border:0;border-radius:14px;min-height:52px;font:800 1rem var(--f-body);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;width:100%}
.kpi.hero .minis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.kpi.hero .minis div{background:rgba(255,255,255,.14);border-radius:12px;padding:8px 10px}
.kpi.hero .minis b{display:block;font:600 1.15rem var(--f-num)}
/* cierre */
.ctable{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.crow{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1.1fr);gap:8px;padding:10px 12px;align-items:center;border-top:1px solid var(--line)}
.crow.head{border-top:0;background:var(--bg);font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.crow label{font-weight:800}
.crow input[type=text]{width:100%;box-sizing:border-box;border:2px solid var(--line);border-radius:10px;padding:8px;font:600 .9rem var(--f-num);background:var(--bg);color:var(--ink)}
.crow input.ok{border-color:var(--ok)}.crow input.off{border-color:var(--warn)}
.crow .chk{display:flex;align-items:center;gap:6px;font-size:.85rem}
.crow .chk input{width:22px;height:22px;accent-color:var(--leaf)}
.diff{padding:0 12px 10px;display:flex;justify-content:flex-end}
/* carrito */
.cart{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.line{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.step button{background:none;border:0;width:34px;height:32px;font-size:1.1rem;color:var(--ink);cursor:pointer}
.step span{min-width:24px;text-align:center}
.total{border-top:1px dashed var(--line);padding-top:10px}
.total .big{font-family:var(--f-num);font-weight:600;font-size:1.6rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font:600 .85rem var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--leaf-ink)}
.btn{border:0;border-radius:12px;padding:12px 16px;font:800 .95rem var(--f-body);cursor:pointer;background:var(--leaf);color:var(--leaf-ink)}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--leaf);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* listas */
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:800}
.item .sub{font-size:.8rem;color:var(--muted)}
.pill{font:800 .7rem var(--f-body);text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:999px;background:var(--gold-soft);color:var(--ink);white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ok{background:transparent;color:var(--ok);border:1px solid var(--line)}
.mini{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font:700 .8rem var(--f-body);color:var(--ink);cursor:pointer;white-space:nowrap}
/* reportes */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi .v{font-family:var(--f-num);font-weight:600;font-size:1.3rem}
.kpi .bs{font-size:.78rem;color:var(--muted)}
.kpi.hero{grid-column:1/-1;background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
.kpi.hero .bs,.kpi.hero .label{color:inherit;opacity:.85}
.kpi.hero .v{font-size:1.9rem}
.bars{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.bar .track{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:4px}
.bar .fill{height:100%;border-radius:5px;background:var(--leaf)}
.bar.alt .fill{background:var(--gold)}
/* hoja inferior */
.scrim{position:fixed;inset:0;background:rgba(10,14,8,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;display:flex;flex-direction:column;gap:14px;max-height:88%;overflow-y:auto}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.8rem;font-weight:800;color:var(--muted)}
.field input,.field select{font:600 1rem var(--f-body);padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px}
.actions .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(80px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:30;font-size:.9rem;max-width:calc(100% - 32px)}
.empty{text-align:center;padding:24px 14px;color:var(--muted)}
.loading{display:grid;place-items:center;height:100%;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
html,body{margin:0;height:100%;overflow:hidden}
body{font-size:15px}
img{max-width:100%}[hidden]{display:none!important}
header{top:0}
header .wrap{padding-top:calc(12px + env(safe-area-inset-top,0px))}
.install{background:transparent;color:var(--leaf-ink);border:1px solid currentColor;border-radius:999px;padding:7px 12px;font:700 .8rem var(--f-body);cursor:pointer;white-space:nowrap}
.hbtns{display:flex;gap:8px;align-items:center}
</style>
</head>
<body>
<header><div class="wrap">
  <h1 class="brand" id="brand">Caja Crujiente<small>Papitas · maní · tostones</small></h1>
  <div class="hbtns"><button class="install" id="btnInstall" type="button" hidden>Instalar</button><button class="tasa" id="btnTasa" type="button">Tasa: —</button><button class="gear" type="button" data-act="ajustes" aria-label="Ajustes"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
</div></header>
<main id="main"><div class="loading">Abriendo tu caja…</div></main>
<div id="dock" hidden></div>

<div id="layer"></div>
<input type="file" id="fileImport" accept="application/json,.json" hidden>

<script>

/* ---------- Almacenamiento: todo queda en este teléfono (IndexedDB) ---------- */
function IDBStore(){
  const dbp=new Promise((res,rej)=>{const r=indexedDB.open('caja-crujiente',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  const get=k=>dbp.then(db=>new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}));
  const put=(k,v)=>dbp.then(db=>new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)}));
  let movs=[],cb=null;
  return{
    async loadCfg(){movs=(await get('movs'))||[];return (await get('cfg'))||null},
    saveCfg:c=>put('cfg',JSON.parse(JSON.stringify(c))),
    async addMov(m){movs=[m,...movs];await put('movs',movs);cb&&cb(movs)},
    async delMov(id){movs=movs.filter(x=>x.id!==id);await put('movs',movs);cb&&cb(movs)},
    async replaceAll(cfg,m){movs=m;await put('cfg',cfg);await put('movs',m);cb&&cb(movs)},
    watch(f){cb=f;f(movs)}
  };
}
function LocalStore(){
  const K='caja-crujiente-v1';
  const read=()=>{try{return JSON.parse(localStorage.getItem(K))||{cfg:null,movs:[]}}catch(e){return {cfg:null,movs:[]}}};
  const write=d=>{try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}};
  let cb=null;
  return{
    async loadCfg(){return read().cfg},
    async saveCfg(c){const d=read();d.cfg=c;write(d)},
    async addMov(m){const d=read();d.movs.unshift(m);write(d);cb&&cb(d.movs)},
    async delMov(id){const d=read();d.movs=d.movs.filter(x=>x.id!==id);write(d);cb&&cb(d.movs)},
    async replaceAll(cfg,m){write({cfg,movs:m});cb&&cb(m)},
    watch(f){cb=f;f(read().movs)}
  };
}
async function boot(){
  try{S.store=IDBStore();S.cfg=await S.store.loadCfg()}catch(e){S.store=LocalStore();S.cfg=await S.store.loadCfg()}
  if(!S.cfg){S.cfg=JSON.parse(JSON.stringify(DEFAULT_CFG));await save()}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  S.store.watch(m=>{S.movs=m.slice().sort((a,b)=>b.t-a.t);render()});
  render();
}
/* ---------- Respaldo ---------- */
async function exportar(){
  const data={app:'caja-crujiente',version:1,fecha:new Date().toISOString(),cfg:S.cfg,movs:S.movs};
  const name='caja-crujiente-respaldo-'+new Date().toISOString().slice(0,10)+'.json';
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  let done=false;
  try{const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Respaldo Caja Crujiente'});done=true}}catch(e){if(e&&e.name==='AbortError')return}
  if(!done){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
  S.cfg.ultimoRespaldo=Date.now();await save();render();toast('Respaldo creado');
}
function importar(file){
  const fr=new FileReader();
  fr.onload=()=>{
    let d;try{d=JSON.parse(fr.result)}catch(e){toast('Ese archivo no es un respaldo válido.');return}
    if(!d||d.app!=='caja-crujiente'||!d.cfg||!Array.isArray(d.movs)){toast('Ese archivo no es un respaldo de Caja Crujiente.');return}
    sheet(`<h2>¿Restaurar este respaldo?</h2><p class="muted" style="margin:0">Es del ${esc(new Date(d.fecha).toLocaleString('es-VE'))}, con ${d.movs.length} movimientos. Reemplaza todo lo que hay ahora en este teléfono.</p>${acts('Restaurar',true)}`,
      async()=>{S.cfg=d.cfg;S.cart={};await S.store.replaceAll(d.cfg,d.movs);render();toast('Respaldo restaurado')});
  };
  fr.readAsText(file);
}

/* ---------- Inicio y cierre de caja ---------- */
function resumenHoy(){
  const ms=filtrar('hoy'),v=ms.filter(m=>m.tipo==='venta'),ab=ms.filter(m=>m.tipo==='abono');
  const por={};METODOS.forEach(([k])=>por[k]={u:0,b:0});
  const tz=m=>m.tasa||S.cfg.tasa||0;
  for(const m of v){if(por[m.metodo]){por[m.metodo].u+=m.total;por[m.metodo].b+=m.total*tz(m)}}
  for(const m of ab){if(por[m.metodo]){por[m.metodo].u+=m.monto;por[m.metodo].b+=m.monto*tz(m)}}
  const total=r2(v.reduce((s,m)=>s+m.total,0)),costo=r2(v.reduce((s,m)=>s+m.costo,0));
  return{por,total,costo,gan:r2(total-costo),n:v.length,abonos:r2(ab.reduce((s,m)=>s+m.monto,0)),cierre:ms.find(m=>m.tipo==='cierre')};
}

function leerCierre(){
  const R=S.esperado||resumenHoy();
  const pv=v=>{v=String(v||'0').trim();return v.includes(',')?num(v.replace(/\./g,'')):num(v)};
  const cu=pv($('#cUsd')?.value),cb=pv($('#cBs')?.value);
  return{R,cu:r2(cu),cb:r2(cb),du:r2(cu-R.por.usd.u),db:r2(cb-R.por.bs.b)};
}
function updCierre(){
  if(!$('#cUsd'))return;
  const {du,db}=leerCierre();
  const msg=(d,f,eq)=>Math.abs(d)<0.005?'<span class="pill ok">Cuadra ✓</span>':`<span class="pill ${d<0?'bad':''}">${d<0?'Faltan':'Sobran'} ${f(Math.abs(d))}${eq&&S.cfg.tasa?' ('+usd(Math.abs(d)/S.cfg.tasa)+')':''}</span>`;
  $('#dUsd').innerHTML=msg(du,usd);$('#dBs').innerHTML=msg(db,bs,true);
  $('#cUsd').className=Math.abs(du)<0.005?'ok':'off';$('#cBs').className=Math.abs(db)<0.005?'ok':'off';
}
function textoResumen(){
  const {R,cu,cb,du,db}=leerCierre();
  const fecha=new Date().toLocaleDateString('es-VE',{weekday:'long',day:'numeric',month:'long'});
  const L=[`Cierre de caja · ${fecha}`,`Vendido: ${usd(R.total)} (${R.n} ventas)`,`Ganancia: ${usd(R.gan)}`,
    `Efectivo $: ${usd(cu)}${Math.abs(du)>=0.005?' ('+(du<0?'faltan ':'sobran ')+usd(Math.abs(du))+')':''}`,
    `Efectivo Bs: ${bs(cb)}${Math.abs(db)>=0.005?' ('+(db<0?'faltan ':'sobran ')+bs(Math.abs(db))+')':''}`,
    `Pago móvil: ${bs(R.por.pm.b)}`,`Punto: ${usd(R.por.punto.u)}`,`Quedó fiado: ${usd(R.por.fiado.u)}`];
  const nota=($('#cNota')?.value||'').trim();if(nota)L.push('Nota: '+nota);
  if(S.cfg.tasa)L.push(`Tasa: Bs ${nf.format(S.cfg.tasa)} / $`);
  return L.join('\n');
}
async function compartir(){
  const t=textoResumen();
  try{if(navigator.share){await navigator.share({text:t});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(t);toast('Resumen copiado. Pégalo en WhatsApp.')}catch(e){toast('No se pudo compartir en este teléfono.')}
}

function filtrar(per){
  const d=new Date();d.setHours(0,0,0,0);let desde=d.getTime();
  if(per==='semana')desde-=6*864e5;
  if(per==='mes'){const m=new Date();desde=new Date(m.getFullYear(),m.getMonth(),1).getTime()}
  if(per==='todo')desde=0;
  return S.movs.filter(m=>m.t>=desde);
}
function vReportes(){
  const ms=filtrar(S.periodo),ventas=ms.filter(m=>m.tipo==='venta'),abonos=ms.filter(m=>m.tipo==='abono');
  const total=r2(ventas.reduce((s,m)=>s+m.total,0)),costo=r2(ventas.reduce((s,m)=>s+m.costo,0)),gan=r2(total-costo);
  const fiado=r2(ventas.filter(m=>m.metodo==='fiado').reduce((s,m)=>s+m.total,0));
  const cobrado=r2(total-fiado+abonos.reduce((s,m)=>s+m.monto,0));
  const porProd={};for(const m of ventas)for(const it of m.items){const k=it.nombre;porProd[k]=porProd[k]||{u:0,v:0};porProd[k].u+=it.cant;porProd[k].v+=it.precio*it.cant}
  const pp=Object.entries(porProd).sort((a,b)=>b[1].v-a[1].v);const maxV=Math.max(1,...pp.map(x=>x[1].v));
  const porMet={};for(const m of ventas)porMet[m.metodo]=(porMet[m.metodo]||0)+m.total;
  const pm=METODOS.filter(([k])=>porMet[k]).map(([k,l])=>[l,porMet[k]]);const maxM=Math.max(1,...pm.map(x=>x[1]));
  const per=[['hoy','Hoy'],['semana','7 días'],['mes','Este mes'],['todo','Todo']];
  const hist=ms.slice(0,40).map(m=>{
    const f=new Date(m.t);const hora=f.toLocaleDateString('es-VE',{day:'2-digit',month:'2-digit'})+' '+f.toLocaleTimeString('es-VE',{hour:'2-digit',minute:'2-digit'});
    let t,sub,monto;
    if(m.tipo==='venta'){t=m.items.map(i=>i.cant+' '+i.nombre).join(', ');sub=(METODOS.find(x=>x[0]===m.metodo)||['',''])[1]+(m.cliente?' · '+(cliente(m.cliente)?.nombre||''):'');monto=usd(m.total)}
    else if(m.tipo==='deuda'){t=(m.nota||'Deuda anotada')+': '+(cliente(m.cliente)?.nombre||'cliente');sub='Fiado sin productos';monto=usd(m.monto)}
    else if(m.tipo==='abono'){t='Abono de '+(cliente(m.cliente)?.nombre||'cliente');sub=(METODOS.find(x=>x[0]===m.metodo)||['',''])[1];monto=usd(m.monto)}
    else if(m.tipo==='cierre'){t='Cierre de caja';sub=m.nota||((Math.abs(m.dif?.usd||0)<0.005&&Math.abs(m.dif?.bs||0)<0.005)?'Todo cuadró':'Con diferencias');monto=usd(m.total)}
    else{t='Producción: '+m.cant+' '+m.nombre;sub='Costo '+usd(m.costoTotal);monto='+'+m.cant}
    return `<div class="item"><div class="grow"><div class="t" style="font-weight:700">${esc(t)}</div><div class="sub">${esc(hora)} · ${esc(sub)}</div></div><div class="num">${monto}</div>${m.tipo==='venta'?`<button type="button" class="mini" data-recibo="${m.id}">Recibo</button>`:''}<button type="button" class="mini" data-anular="${m.id}" aria-label="Anular">✕</button></div>`}).join('');
  return `<div class="row"><h2>Reportes</h2></div>
    <div class="chips">${per.map(([k,l])=>`<button type="button" class="chip" data-per="${k}" aria-pressed="${S.periodo===k}">${l}</button>`).join('')}</div>
    <div class="kpis">
      <div class="kpi hero"><div class="label">Ganancia</div><div class="v">${usd(gan)}</div><div class="bs">${S.cfg.tasa?bs(toBs(gan))+' · ':''}${total?Math.round(gan/total*100):0}% de lo vendido</div></div>
      <div class="kpi"><div class="label">Vendido</div><div class="v">${usd(total)}</div><div class="bs">${ventas.length} ventas</div></div>
      <div class="kpi"><div class="label">Costo</div><div class="v">${usd(costo)}</div><div class="bs">de lo vendido</div></div>
      <div class="kpi"><div class="label">Cobrado</div><div class="v">${usd(cobrado)}</div><div class="bs">incluye abonos</div></div>
      <div class="kpi"><div class="label">Quedó fiado</div><div class="v" style="color:${fiado?'var(--bad)':'inherit'}">${usd(fiado)}</div><div class="bs">en este periodo</div></div>
    </div>
    <section class="bars" aria-label="Ventas por producto"><h3>Por producto</h3>${pp.length?pp.map(([n,x])=>`<div class="bar"><div class="row"><span>${esc(n)}</span><span class="num muted">${x.u} und · ${usd(x.v)}</span></div><div class="track"><div class="fill" style="width:${x.v/maxV*100}%"></div></div></div>`).join(''):'<p class="muted" style="margin:0">Sin ventas en este periodo.</p>'}</section>
    <section class="bars" aria-label="Ventas por forma de pago"><h3>Por forma de pago</h3>${pm.length?pm.map(([l,v])=>`<div class="bar alt"><div class="row"><span>${l}</span><span class="num muted">${usd(v)}</span></div><div class="track"><div class="fill" style="width:${v/maxM*100}%"></div></div></div>`).join(''):'<p class="muted" style="margin:0">Sin ventas en este periodo.</p>'}</section>
    <h3>Movimientos</h3><div class="list">${hist||'<div class="empty">Aquí aparecerán tus ventas, abonos y producción.</div>'}</div>
    <section class="bars" aria-label="Respaldo"><h3>Respaldo</h3>
      <p class="muted" style="margin:0">Guarda un archivo con todos tus datos y envíalo a WhatsApp, Drive o tu correo. Con él recuperas todo si cambias de teléfono.${S.cfg.ultimoRespaldo?' Último respaldo: '+new Date(S.cfg.ultimoRespaldo).toLocaleDateString('es-VE')+'.':''}</p>
      <div class="actions"><button type="button" class="btn" data-act="exportar">Crear respaldo</button><button type="button" class="btn ghost" data-act="importar">Restaurar</button></div>
    </section>`;
}

async function cobrar(){
  const lines=cartLines();if(!lines.length)return;
  if(S.metodo==='fiado'&&!S.cliente){toast('Elige el cliente que se lleva fiado.');return}
  const items=lines.map(l=>({pid:l.p.id,nombre:l.p.nombre,cant:l.q,precio:l.p.precio,costo:l.p.costo}));
  const total=cartTotal(),costo=r2(items.reduce((s,i)=>s+i.costo*i.cant,0));
  for(const l of lines)l.p.stock-=l.q;
  const m={id:uid(),tipo:'venta',t:Date.now(),items,total,costo,tasa:S.cfg.tasa,metodo:S.metodo};
  if(S.metodo==='fiado')m.cliente=S.cliente;
  S.cart={};await save();
  try{await S.store.addMov(m)}catch(e){toast('No se registró la venta. Revisa tu conexión.');return}
  S.ultima=m.id;
  render();toast(S.metodo==='fiado'?'Fiado anotado: '+usd(total):'Venta cobrada: '+usd(total)+(S.cfg.tasa?' · '+bs(toBs(total)):''));
}

  const op=[['auto','Automático','Como el teléfono'],['claro','Claro','Fondo claro'],['oscuro','Oscuro','Para la noche'],['sol','Modo sol','Más contraste y letra grande']];
  sheet(`<h2>Ajustes</h2>
    <div class="field"><label for="fNeg">Nombre del negocio</label><input id="fNeg" name="negocio" value="${esc(S.cfg.negocio||'Caja Crujiente')}" placeholder="Ej. Snacks El Pipo"></div>
    <div class="field"><label for="fPie">Mensaje al pie del recibo (opcional)</label><input id="fPie" name="pie" value="${esc(S.cfg.pie||'')}" placeholder="Ej. Pago móvil: 0414-0000000"></div>
    <fieldset style="border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px"><legend class="label" style="margin-bottom:6px">Apariencia</legend>
      <div class="themes">${op.map(([k,l,d])=>`<label><input type="radio" name="tema" value="${k}" ${t===k?'checked':''}>${l}<small>${d}</small></label>`).join('')}</div></fieldset>
    ${acts('Guardar')}`,
  async fd=>{S.cfg.negocio=String(fd.get('negocio')||'').trim()||'Caja Crujiente';S.cfg.pie=String(fd.get('pie')||'').trim();S.cfg.tema=String(fd.get('tema')||'auto');await save();render();toast('Ajustes guardados')});
}
/* ---------- Recibos e imágenes para compartir ---------- */
function fitText(x,str,maxW){str=String(str);if(x.measureText(str).width<=maxW)return str;while(str.length>1&&x.measureText(str+'…').width>maxW)str=str.slice(0,-1);return str+'…'}
async function ticketPNG(t){
  try{await document.fonts.ready}catch(e){}
  const W=600,P=36,LH=36,SANS='"Nunito Sans", system-ui, sans-serif',MONO='"IBM Plex Mono", ui-monospace, monospace',DISP='"Bricolage Grotesque", "Nunito Sans", sans-serif';
  const extra=t.extra||[];
  const H=176+t.lineas.length*LH+34+t.totales.length*44+(extra.length?16+extra.length*28:0)+96;
  const c=document.createElement('canvas'),sc=2;c.width=W*sc;c.height=H*sc;const x=c.getContext('2d');x.scale(sc,sc);
  x.fillStyle='#FFFFFF';x.fillRect(0,0,W,H);
  x.fillStyle='#1E5B37';x.fillRect(0,0,W,124);x.fillStyle='#F2B705';x.fillRect(0,124,W,6);
  x.fillStyle='#FFFFFF';x.font='800 32px '+DISP;x.fillText(fitText(x,negocio(),W-2*P),P,60);
  x.font='600 18px '+SANS;x.globalAlpha=.9;x.fillText(fitText(x,t.titulo+' · '+t.fecha,W-2*P),P,96);x.globalAlpha=1;
  let y=176;
  for(const l of t.lineas){
    x.font='600 20px '+MONO;const dw=x.measureText(l.der).width;
    x.fillStyle=l.colorDer||'#1D2418';x.textAlign='right';x.fillText(l.der,W-P,y);x.textAlign='left';
    x.fillStyle='#1D2418';x.font=(l.bold?'800 ':'600 ')+'20px '+SANS;x.fillText(fitText(x,l.izq,W-2*P-dw-18),P,y);
    y+=LH;
  }
  x.strokeStyle='#C9CFBC';x.setLineDash([8,7]);x.lineWidth=2;x.beginPath();x.moveTo(P,y-14);x.lineTo(W-P,y-14);x.stroke();x.setLineDash([]);
  y+=20;
  t.totales.forEach((tt,i)=>{
    x.fillStyle=tt.color||'#1D2418';x.font=(i===0?'600 30px ':'500 20px ')+MONO;x.textAlign='right';x.fillText(tt.der,W-P,y);x.textAlign='left';
    x.font=(i===0?'800 24px ':'600 19px ')+SANS;x.fillText(tt.izq,P,y);y+=44;
  });
  if(extra.length){y+=4;x.fillStyle='#5A6450';x.font='600 17px '+SANS;for(const e of extra){x.fillText(fitText(x,e,W-2*P),P,y);y+=28}}
  x.fillStyle='#1E5B37';x.font='800 19px '+SANS;x.textAlign='center';x.fillText(fitText(x,(S.cfg.pie||'').trim()||'¡Gracias por su compra!',W-2*P),W/2,H-44);x.textAlign='left';
  return new Promise(r=>c.toBlob(r,'image/png'));
}
function sImagen(blob,name,titulo){
  const url=URL.createObjectURL(blob),file=new File([blob],name,{type:'image/png'});
  let can=false;try{can=!!(navigator.canShare&&navigator.canShare({files:[file]}))}catch(e){}
  sheet(`<h2>${esc(titulo)}</h2><img src="${url}" alt="${esc(titulo)}" style="width:100%;border-radius:12px;border:1px solid var(--line)">
    <div class="actions"><button type="button" class="btn ghost" data-cancel>Cerrar</button>${can?'<button type="submit" class="btn">Enviar por WhatsApp…</button>':`<a class="btn" href="${url}" download="${esc(name)}" style="text-align:center;text-decoration:none">Descargar imagen</a>`}</div>
    ${can?'':'<p class="muted" style="margin:0;font-size:.8rem">Descárgala y envíala desde la galería.</p>'}`,
  async()=>{try{await navigator.share({files:[file],title:titulo})}catch(e){return false}});
}
const fechaHora=t=>new Date(t).toLocaleDateString('es-VE',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+new Date(t).toLocaleTimeString('es-VE',{hour:'2-digit',minute:'2-digit'});
async function recibo(mid){
  const m=S.movs.find(x=>x.id===mid);if(!m||m.tipo!=='venta')return;
  const tasa=m.tasa||S.cfg.tasa||0;
  const lineas=m.items.map(it=>({izq:`${it.cant} × ${it.nombre}`,der:usd(it.precio*it.cant)}));
  const totales=[{izq:'Total',der:usd(m.total)}];if(tasa)totales.push({izq:'En bolívares',der:bs(m.total*tasa)});
  const extra=['Forma de pago: '+((METODOS.find(x=>x[0]===m.metodo)||['',''])[1])];
  if(m.cliente){const c=cliente(m.cliente);if(c)extra.push('Cliente: '+c.nombre);extra.push('Debe en total: '+usd(deuda(m.cliente)))}
  if(tasa)extra.push('Tasa: Bs '+nf.format(tasa)+' por $');
  const blob=await ticketPNG({titulo:m.metodo==='fiado'?'Nota de fiado':'Recibo',fecha:fechaHora(m.t),lineas,totales,extra});
  sImagen(blob,'recibo-'+new Date(m.t).toISOString().slice(0,10)+'.png',m.metodo==='fiado'?'Nota de fiado':'Recibo de venta');
}
async function estadoCuenta(cid){
  const c=cliente(cid);if(!c)return;
  const ms=S.movs.filter(m=>m.cliente===cid&&(m.tipo==='abono'||m.tipo==='deuda'||(m.tipo==='venta'&&m.metodo==='fiado'))).slice().sort((a,b)=>a.t-b.t);
  const ult=ms.slice(-18);
  const f=t=>new Date(t).toLocaleDateString('es-VE',{day:'2-digit',month:'2-digit'});
  const lineas=ult.map(m=>m.tipo==='abono'?{izq:f(m.t)+' · Abono',der:'−'+usd(m.monto),colorDer:'#1E7A45'}
    :m.tipo==='deuda'?{izq:f(m.t)+' · '+(m.nota||'Deuda anotada'),der:'+'+usd(m.monto)}
    :{izq:f(m.t)+' · '+m.items.map(i=>i.cant+' '+i.nombre).join(', '),der:'+'+usd(m.total)});
  if(!lineas.length)lineas.push({izq:'Sin movimientos',der:usd(0)});
  const d=deuda(cid);
  const totales=[{izq:'Debe en total',der:usd(d),color:d>0?'#A3150D':'#1E7A45'}];if(S.cfg.tasa&&d>0)totales.push({izq:'En bolívares (tasa de hoy)',der:bs(toBs(d))});
  const extra=['Cliente: '+c.nombre];if(ms.length>ult.length)extra.push(`Se muestran los últimos ${ult.length} de ${ms.length} movimientos`);
  if(S.cfg.tasa)extra.push('Tasa: Bs '+nf.format(S.cfg.tasa)+' por $');
  const blob=await ticketPNG({titulo:'Estado de cuenta',fecha:fechaHora(Date.now()),lineas,totales,extra});
  sImagen(blob,'estado-de-cuenta-'+c.nombre.replace(/[^\wáéíóúñ]+/gi,'-').toLowerCase()+'.png','Estado de cuenta de '+c.nombre);
}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-close]');if(!b)return;
  if(b.hasAttribute('data-close')&&e.target!==b)return;
  const d=b.dataset;
  if(d.close!==undefined||d.cancel!==undefined){closeSheet();return}
  if(b.id==='btnTasa')return sTasa();
  if(d.tab){S.view=d.tab;render();$('#main').scrollTop=0;return}
  if(d.add){const p=prod(d.add);const q=S.cart[d.add]||0;if(p.stock-q<=0)toast('Te quedaste sin '+p.nombre+'. Se vende igual, revisa el stock.');S.cart[d.add]=q+1;render();return}
  if(d.dec){S.cart[d.dec]=Math.max(0,(S.cart[d.dec]||0)-1);render();return}
  if(d.met){S.metodo=d.met;render();return}
  if(d.per){S.periodo=d.per;render();return}
  if(d.prod)return sProduccion(d.prod);
  if(d.edit)return sProducto(d.edit);
  if(d.abono)return sAbono(d.abono);
  if(d.deuda)return sDeuda(d.deuda);
  if(d.editcli)return sCliente(d.editcli);
  if(d.delcli){if(deuda(d.delcli)!==0)return;S.cfg.clientes=S.cfg.clientes.filter(c=>c.id!==d.delcli);if(S.cliente===d.delcli)S.cliente='';save();closeSheet();render();toast('Cliente eliminado');return}
  if(d.anular)return sAnular(d.anular);
  if(d.delprod){S.cfg.productos=S.cfg.productos.filter(p=>p.id!==d.delprod);delete S.cart[d.delprod];save();closeSheet();render();toast('Producto eliminado');return}
  if(d.act==='vaciar'){S.cart={};render()}
  if(d.act==='cobrar')cobrar();
  if(d.act==='nuevoCli')sCliente();
  if(d.act==='nuevoProd')sProducto();
  if(d.act==='ajustes')sAjustes();
  if(d.recibo){recibo(d.recibo);return}
  if(d.estado){estadoCuenta(d.estado);return}
  if(d.act==='cierre'){S.view='cierre';render();$('#main').scrollTop=0}
  if(d.act==='compartir')compartir();
  if(d.act==='cerrarCaja')cerrarCaja();
  if(d.act==='exportar')exportar();
  if(d.act==='importar')$('#fileImport').click();
  if(b.id==='btnInstall'&&installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;b.hidden=true})}
});
document.addEventListener('change',e=>{if(e.target.id==='selCli'){S.cliente=e.target.value;render()}if(e.target.id==='fileImport'){const f=e.target.files[0];e.target.value='';if(f)importar(f)}});
document.addEventListener('input',e=>{if(e.target.id==='cUsd'||e.target.id==='cBs')updCierre()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

boot();
})();
</script>
